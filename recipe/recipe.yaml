context:
  version: "11.1.0"
  major_minor: ${{ (version | split('.'))[:2] | join('.') }}

package:
  name: cyclonedds-cxx
  version: ${{ version }}

source:
  url: https://github.com/eclipse-cyclonedds/cyclonedds-cxx/archive/refs/tags/${{ version }}.tar.gz
  sha256: 8d11013becd93e5527f5bfd808d987e0fc5d56ddafe77fdff178657f4bf7e77b

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - ninja
    - if: build_platform != target_platform
      then:
        - cyclonedds ${{ major_minor }}.*
  host:
    - cyclonedds ${{ major_minor }}.*
  run:
    - cyclonedds ${{ major_minor }}.*
  run_exports:
    - ${{ pin_subpackage('cyclonedds-cxx', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - ddscxx/dds/dds.hpp
      files:
        - if: unix
          then:
            - lib/cmake/CycloneDDS-CXX/CycloneDDS-CXXConfig.cmake
          else:
            - Library/lib/cmake/CycloneDDS-CXX/CycloneDDS-CXXConfig.cmake
      lib:
        - ddscxx

about:
  homepage: https://cyclonedds.io
  summary: C++ binding for Eclipse Cyclone DDS
  description: |
    An implementation of the ISO/IEC C++ PSM, or simply put, a C++ binding for 
    Eclipse Cyclone DDS. Cyclone DDS is developed completely in the open as an 
    Eclipse IoT project (see eclipse-cyclone-dds) with a growing list of adopters 
    (if you're one of them, please add your logo).
    It is a tier-1 middleware for the Robot Operating System ROS 2.
  license: EPL-2.0 OR BSD-3-Clause
  license_file: LICENSE
  documentation: https://cyclonedds.io/docs/cyclonedds-cxx/latest/
  repository: https://github.com/eclipse-cyclonedds/cyclonedds-cxx

extra:
  recipe-maintainers:
    - nmarticorena
